name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Trust cask
        run: brew trust --cask yanokamay-org/tap/maiestro-code

      - name: Style
        run: brew style yanokamay-org/tap

      - name: Audit
        run: brew audit --cask --strict --online yanokamay-org/tap/maiestro-code

      - name: Install
        run: brew install --cask yanokamay-org/tap/maiestro-code
